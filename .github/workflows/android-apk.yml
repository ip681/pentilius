# Builds the signed Android app (apps/mobile) on GitHub's Linux servers
# (owner decision, 2026-10-19 — no expo.dev, no build tools on the dev PC).
# Started by hand (Actions → "Android APK" → Run workflow). The APK is left as
# a download on the run page; uploading it to pentilius.com is a separate,
# manual step — GitHub gets no access to the server.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — secrets/pentilius-release.keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD — from secrets/android-keystore.txt
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the app's packages
        run: npm ci

      # Every build gets a higher version code, so it installs over the previous one.
      - name: Set the version code
        run: node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));a.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync('app.json',JSON.stringify(a,null,2))"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Put the signing key in place
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pentilius-release.keystore"

      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon --console=plain
          -PPENTILIUS_STORE_FILE="$RUNNER_TEMP/pentilius-release.keystore"
          -PPENTILIUS_KEY_ALIAS=pentilius
          -PPENTILIUS_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          -PPENTILIUS_KEY_PASSWORD="$KEYSTORE_PASSWORD"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pentilius-release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: pentilius-apk-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
